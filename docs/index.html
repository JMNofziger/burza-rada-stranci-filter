<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zagreb foreign-friendly jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script>
    try {
      var t = localStorage.getItem("hzz-theme");
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      var l = localStorage.getItem("hzz-lang");
      if (l === "hr" || l === "en") document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1><a href="./index.html" data-i18n="title">Matching jobs</a></h1>
        <p class="subtitle" data-i18n="subtitle">Grad Zagreb · foreigner-coded ads or UV shortage occupations</p>
      </div>
      <div class="topbar-actions">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" id="lang-en" class="seg-btn" aria-pressed="true">EN</button>
          <button type="button" id="lang-hr" class="seg-btn" aria-pressed="false">HR</button>
        </div>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch color theme" title="Theme">
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              d="M12 3.2v1.8M12 19v1.8M3.2 12h1.8M19 12h1.8M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M18.4 5.6l-1.3 1.3M6.9 17.1l-1.3 1.3"/>
          </svg>
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              d="M16.2 13.8A6.2 6.2 0 0 1 10.1 5a6.4 6.4 0 1 0 6.1 8.8Z"/>
          </svg>
        </button>
        <a href="https://github.com/JMNofziger/burza-rada-stranci-filter/blob/main/product/METHOD.md" class="btn ghost" data-i18n="method" target="_blank" rel="noopener">Method</a>
        <button type="button" id="filter-open" class="btn ghost" aria-controls="filters" aria-expanded="false" data-i18n="filters">
          Filters
        </button>
      </div>
    </div>
  </header>

  <div class="board">
    <div id="backdrop" class="backdrop" hidden></div>
    <aside id="filters" class="drawer" aria-label="Filters">
    <div class="drawer-head">
      <h2 data-i18n="filters">Filters</h2>
      <button type="button" id="filter-close" class="btn ghost" data-i18n="done">Done</button>
    </div>
    <form id="filter-form">
      <fieldset>
        <legend data-i18n="expiring">Expiring</legend>
        <label><input type="checkbox" name="urgency" value="48h"> <span data-i18n="u48h">Within 48 hours</span></label>
        <label><input type="checkbox" name="urgency" value="7d"> <span data-i18n="u7d">Within 7 days</span></label>
        <label><input type="checkbox" name="urgency" value="later"> <span data-i18n="ulater">Later</span></label>
        <label><input type="checkbox" name="urgency" value="open"> <span data-i18n="uopen">Open-ended</span></label>
        <label><input type="checkbox" name="urgency" value="expired"> <span data-i18n="uexpired">Expired</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="track">Track</legend>
        <label><input type="checkbox" name="track" value="foreigner_text"> <span data-i18n="trackText">Foreigner-coded ad</span></label>
        <label><input type="checkbox" name="track" value="shortage_occupation"> <span data-i18n="trackShortage">Shortage occupation (TTR skip)</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="location">Location</legend>
        <label><input type="checkbox" name="location" value="City centre"> <span data-i18n="locCentre">City centre</span></label>
        <label><input type="checkbox" name="location" value="Zagreb"> <span data-i18n="locZagreb">Zagreb</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="telegram">Telegram</legend>
        <label><input type="radio" name="notified" value="any" checked> <span data-i18n="tgAny">Any</span></label>
        <label><input type="radio" name="notified" value="no"> <span data-i18n="tgNo">Not sent yet</span></label>
        <label><input type="radio" name="notified" value="yes"> <span data-i18n="tgYes">Already sent</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="employer">Employer</legend>
        <div id="employer-filters" class="check-list"></div>
      </fieldset>
      <button type="button" id="filter-reset" class="btn btn-wide danger-outline" data-i18n="clear">Clear filters</button>
    </form>
    </aside>

    <main>
      <div class="tools">
        <input id="search" type="search" data-i18n-placeholder="search" placeholder="Search title, employer, keywords" autocomplete="off">
        <label class="sort-label">
          <span data-i18n="sort">Sort</span>
          <select id="sort">
            <option value="deadline" data-i18n="sortDeadline">Expiry (soonest)</option>
            <option value="newest" data-i18n="sortNewest">Newest seen</option>
            <option value="score" data-i18n="sortScore">Foreign score</option>
            <option value="title" data-i18n="sortTitle">Title A–Z</option>
          </select>
        </label>
      </div>
      <p class="meta"><span data-i18n="updated">Updated</span> <span id="generated">—</span></p>
      <p id="listing-count" class="listing-count" aria-live="polite">0 listings</p>
      <p id="error" class="error" hidden></p>
      <p id="empty" class="empty" hidden data-i18n="empty">No listings match these filters.</p>
      <ol id="results" class="results"></ol>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
