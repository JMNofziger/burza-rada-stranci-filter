<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HZZ matching jobs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/css/tabulator.min.css">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #fff;
      --ink: #1b1f24;
      --muted: #5c6570;
      --line: #d8dee6;
      --accent: #0b5cab;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 650;
    }
    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    #search {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    #row-count { color: var(--muted); font-size: 0.9rem; }
    button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    #table { margin: 0; }
    .urgency {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .urgency-48h { background: #fde8e8; color: #9b1c1c; }
    .urgency-7d { background: #fff4d6; color: #8a5a00; }
    .urgency-open { background: #e6f1fb; color: #0b5cab; }
    .urgency-later { background: #eef1f4; color: #3d4650; }
    .urgency-expired { background: #ececec; color: #6b7280; }
    .error {
      margin: 16px 20px;
      padding: 12px 14px;
      background: #fde8e8;
      color: #9b1c1c;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Matching jobs</h1>
    <p class="meta">
      Local spreadsheet of filter matches from <code>jobs</code>.
      Generated <span id="generated">—</span>. Loopback only.
    </p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search all columns" autocomplete="off">
      <span id="row-count">0 matching jobs</span>
      <button id="export" type="button">Export CSV</button>
    </div>
  </header>
  <div id="error" class="error" hidden></div>
  <div id="table"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/js/tabulator.min.js"></script>
  <script>
    const listFilter = { valuesLookup: true, clearable: true, sort: "asc" };

    function deadlineSorter(a, b) {
      const av = a || "9999-12-31";
      const bv = b || "9999-12-31";
      return av.localeCompare(bv);
    }

    function daysSorter(a, b) {
      const av = a === null || a === undefined ? Number.POSITIVE_INFINITY : a;
      const bv = b === null || b === undefined ? Number.POSITIVE_INFINITY : b;
      return av - bv;
    }

    const table = new Tabulator("#table", {
      height: "calc(100vh - 132px)",
      layout: "fitDataStretch",
      placeholder: "No matching jobs in the local database yet. Run a collect first.",
      columnDefaults: { headerFilterPlaceholder: "filter" },
      initialSort: [{ column: "deadline_date", dir: "asc" }],
      columns: [
        {
          title: "Title", field: "title", minWidth: 220, frozen: true,
          formatter: "link",
          formatterParams: { urlField: "detail_url", target: "_blank" },
          headerFilter: "input",
        },
        { title: "Employer", field: "employer", minWidth: 140, headerFilter: "input" },
        {
          title: "Location", field: "location_label", width: 120,
          headerFilter: "list", headerFilterParams: listFilter,
        },
        {
          title: "Expiry", field: "deadline_date", width: 120,
          sorter: deadlineSorter, headerFilter: "input",
          formatter: (cell) => cell.getValue() || "open",
        },
        {
          title: "Days left", field: "days_until_deadline", width: 110, hozAlign: "right",
          sorter: daysSorter, headerFilter: "number",
          formatter: (cell) => {
            const v = cell.getValue();
            return v === null || v === undefined ? "" : v;
          },
        },
        {
          title: "Urgency", field: "urgency", width: 100,
          headerFilter: "list", headerFilterParams: listFilter,
          formatter: (cell) => {
            const v = cell.getValue() || "";
            return `<span class="urgency urgency-${v}">${v}</span>`;
          },
        },
        {
          title: "Foreign score", field: "foreign_score", width: 130, hozAlign: "right",
          headerFilter: "number",
        },
        { title: "Keywords", field: "matched_keywords", minWidth: 160, headerFilter: "input" },
        { title: "First seen", field: "first_seen_at", width: 160, headerFilter: "input" },
        {
          title: "Notified", field: "notified", width: 110, hozAlign: "center",
          formatter: (cell) => cell.getValue() ? "yes" : "no",
          headerFilter: "list",
          headerFilterParams: { values: { true: "yes", false: "no" }, clearable: true },
        },
        {
          title: "Digest day", field: "digest_day", width: 110, hozAlign: "right",
          headerFilter: "number",
          formatter: (cell) => cell.getValue() == null ? "" : cell.getValue(),
        },
        { title: "WebSifra", field: "web_sifra", width: 120, headerFilter: "input" },
      ],
    });

    function updateCount() {
      const active = table.getDataCount("active");
      const total = table.getDataCount();
      const el = document.getElementById("row-count");
      if (active === total) {
        el.textContent = `${total} matching job${total === 1 ? "" : "s"}`;
      } else {
        el.textContent = `${active} of ${total} matching jobs`;
      }
    }

    table.on("dataFiltered", updateCount);
    table.on("dataLoaded", updateCount);
    table.on("dataProcessed", updateCount);

    document.getElementById("search").addEventListener("input", (event) => {
      const q = event.target.value.trim().toLowerCase();
      if (!q) {
        table.clearFilter();
        return;
      }
      table.setFilter((data) =>
        Object.values(data).some((value) => String(value ?? "").toLowerCase().includes(q))
      );
    });

    document.getElementById("export").addEventListener("click", () => {
      table.download("csv", "hzz-matching-jobs.csv");
    });

    fetch("/api/jobs")
      .then((res) => {
        if (!res.ok) throw new Error("Could not load /api/jobs (" + res.status + ")");
        return res.json();
      })
      .then((payload) => {
        document.getElementById("generated").textContent = payload.generated_at || "—";
        return table.setData(payload.jobs || []);
      })
      .catch((err) => {
        const box = document.getElementById("error");
        box.hidden = false;
        box.textContent = err.message || String(err);
      });
  </script>
</body>
</html>
