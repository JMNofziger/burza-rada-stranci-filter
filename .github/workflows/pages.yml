name: Deploy jobs board

# Publishes docs/ when the site files change (merge to main). Daily/full-scrape
# workflows also deploy after a collect. Persist commits use [skip ci], so this
# file does not re-run tests or redeploy those data-only commits.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: pages
        uses: actions/deploy-pages@v4
