name: HZZ Zagreb daily digest

permissions:
  contents: write

# Unattended daily pull: GitHub Actions cron fires without anyone prompting.
# Scheduled workflows only run on the default branch (main) after this file
# is merged, and only if TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID repo secrets exist.
on:
  schedule:
    # GitHub Actions cron is UTC. 06:00 UTC ≈ 08:00 CEST (summer) / 07:00 CET
    # (winter) -- adjust across the DST boundary if exact local time matters,
    # or compute the offset at runtime instead of relying on a fixed cron.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_size:
        description: "smoke = health probe + tiny digest. full = health probe then all Grad Zagreb."
        type: choice
        options:
          - smoke
          - full
        default: smoke

concurrency:
  group: hzz-daily
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  smoke:
    name: Smoke scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Telegram secrets
        run: python main.py telegram-check
      - name: Live smoke scrape
        env:
          HZZ_MAX_CATEGORIES: "1"
          HZZ_MAX_LISTINGS: "5"
        run: python main.py smoke

  alert-smoke:
    name: Critical alert (smoke failed)
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send critical Telegram alert
        run: python main.py alert-critical "Smoke scrape failed. Full Grad Zagreb collect was skipped."

  collect:
    name: Full collect
    needs: smoke
    if: ${{ success() && (github.event_name == 'schedule' || github.event.inputs.run_size != 'smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily pipeline
        run: python main.py daily
      - name: Persist state DB
        run: |
          git config user.name "hzz-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/hzz_jobs.sqlite3 ]; then
            git add data/hzz_jobs.sqlite3
            git diff --cached --quiet || git commit -m "chore: update job state DB [skip ci]"
            git push
          else
            echo "No state DB produced; skipping persist step."
          fi

  collect-smoke:
    name: Smoke digest (manual)
    needs: smoke
    if: ${{ success() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_size == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run smoke digest
        env:
          HZZ_SMOKE: "1"
          HZZ_MAX_CATEGORIES: "1"
          HZZ_MAX_LISTINGS: "20"
          HZZ_DB_PATH: data/hzz_jobs.smoke.sqlite3
        run: python main.py daily

  alert-collect:
    name: Critical alert (full collect failed)
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send critical Telegram alert
        run: python main.py alert-critical "Full daily collect failed after smoke passed. Unseen listings will catch up on the next successful run."
