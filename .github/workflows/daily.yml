name: HZZ Zagreb daily digest

permissions:
  contents: write
  pages: write
  id-token: write

# Unattended daily pull: GitHub Actions cron fires without anyone prompting.
# Scheduled workflows only run on the default branch (main) after this file
# is merged, and only if TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID repo secrets exist.
on:
  schedule:
    # GitHub Actions cron is UTC. 06:00 UTC ≈ 08:00 CEST (summer) / 07:00 CET
    # (winter) -- adjust across the DST boundary if exact local time matters,
    # or compute the offset at runtime instead of relying on a fixed cron.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_size:
        description: "smoke = silent health probe (Telegram only on failure). full = probe then all Grad Zagreb."
        type: choice
        options:
          - smoke
          - full
        default: smoke

concurrency:
  group: hzz-pipeline
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  smoke:
    name: Smoke scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Telegram secrets
        run: python main.py telegram-check
      - name: Live smoke scrape
        env:
          HZZ_MAX_CATEGORIES: "1"
          HZZ_MAX_LISTINGS: "5"
        run: python main.py smoke

  alert-smoke:
    name: Critical alert (smoke failed)
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send critical Telegram alert
        run: python main.py alert-critical "Smoke scrape failed. Full Grad Zagreb collect was skipped."

  collect:
    name: Full collect
    needs: smoke
    if: ${{ success() && (github.event_name == 'schedule' || github.event.inputs.run_size != 'smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so persist can rebase onto origin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily pipeline
        run: python main.py daily
      - name: Persist state DB and jobs board
        run: |
          bash .github/scripts/persist-state.sh "chore: update job state DB [skip ci]"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish-board:
    name: Publish jobs board
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy jobs board
        id: pages
        uses: actions/deploy-pages@v4

  alert-collect:
    name: Critical alert (full collect failed)
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send critical Telegram alert
        run: python main.py alert-critical "Full daily collect failed after smoke passed. Unseen listings will catch up on the next successful run."
